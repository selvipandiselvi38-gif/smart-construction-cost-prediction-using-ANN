{% extends "base.html" %}{% block title %}Predict Cost{% endblock %}{% block content %}<div class="form-card"><h1>Construction Cost Prediction</h1><p>Enter project details.</p><form method="post" class="grid"><div><label>Building Area (sq.ft)</label><input type="number" step="0.01" name="building_area" required></div><div><label>Number of Floors</label><input type="number" name="floors" required></div><div><label>Material Cost (₹)</label><input type="number" step="0.01" name="material_cost" required></div><div><label>Labour Cost (₹)</label><input type="number" step="0.01" name="labour_cost" required></div><div><label>Project Duration (days)</label><input type="number" step="0.01" name="project_duration" required></div><div><label>Concrete Quantity (m³)</label><input type="number" step="0.01" name="concrete_quantity" required></div><div><label>Steel Quantity (tonnes)</label><input type="number" step="0.001" name="steel_quantity" required></div><div><label>BOQ Cost (₹)</label><input type="number" step="0.01" name="boq_cost" required></div><div><label>BBS Cost (₹)</label><input type="number" step="0.01" name="bbs_cost" required></div><div><label>Location</label><select name="location" required><option value="">Select</option><option>Chennai</option><option>Coimbatore</option><option>Madurai</option><option>Trichy</option><option>Salem</option></select></div><div class="full"><button class="btn">Predict Construction Cost</button></div></form></div>{% endblock %}
